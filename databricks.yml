bundle:
  name: insurance_claim_stream

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog used by the pipeline
    default: main
  schema:
    description: Schema containing pipeline tables
    default: insurance_claims
  landing_schema:
    description: Schema containing the landing volume
    default: insurance_claims
  volume:
    description: Landing volume name
    default: claim_events
  checkpoint_root:
    description: Directory within the volume for streaming checkpoints
    default: _checkpoints
  cluster_id:
    description: Existing cluster used for notebook tasks

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_VIEW
        group_name: users
